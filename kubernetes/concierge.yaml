juju:
  model-defaults:
    logging-config: <root>=INFO; unit=DEBUG; juju.rpc=TRACE
providers:
  microk8s:
    enable: true
    bootstrap: true
    addons:
      - dns
      - hostpath-storage
host:
  snaps:
    jhack:
      channel: latest/edge
      connections:
        - jhack:dot-local-share-juju snapd
