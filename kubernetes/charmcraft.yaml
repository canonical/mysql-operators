type: charm
platforms:
  ubuntu@26.04:amd64:
  ubuntu@26.04:arm64:
  # ubuntu@26.04:s390x:
parts:
  # "poetry-deps" part name is a magic constant
  # https://github.com/canonical/craft-parts/pull/901
  poetry-deps:
    plugin: nil
    override-build: |
      python3 -m pip install --user --break-system-packages --upgrade pip==25.3  # renovate: charmcraft-pip-latest
      python3 -m pip install --user --break-system-packages poetry==2.5.1        # renovate: charmcraft-poetry-latest
      python3 -m pip install --user --break-system-packages poetry-plugin-export==1.9.0

      ln -sf "$HOME/.local/bin/poetry" /usr/local/bin/poetry

      python3 -m pip install --user --break-system-packages charmcraftlocal
  # "charm-poetry" part name is arbitrary; use for consistency
  # Avoid using "charm" part name since that has special meaning to charmcraft
  # By default, the `poetry` plugin creates/stages directories: lib, src and venv
  charm-poetry:
    plugin: poetry
    source: .
    after:
      - poetry-deps
    poetry-export-extra-args: ["--without-hashes"]
    build-packages:
      - libffi-dev
      - libssl-dev
      - pkg-config
      - rustc
    override-build: |
      "$HOME/.local/bin/charmcraftlocal" update-lock -v

      craftctl default

      # Include requirements.txt in *.charm artifact for easier debugging
      cp requirements.txt "$CRAFT_PART_INSTALL/requirements.txt"
  # "files" part name is arbitrary; use for consistency
  files:
    plugin: dump
    source: .
    after:
      - poetry-deps
    build-packages:
      - git
    override-build: |
      # Set `charm_version` in refresh_versions.toml from git tag
      # Create venv in `..` so that git working tree is not dirty
      python3 -m venv ../refresh-version-venv
      source ../refresh-version-venv/bin/activate
      poetry install --only build
      write-charm-version

      craftctl default
    stage:
      - refresh_versions.toml
