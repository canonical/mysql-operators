name: mysql-k8s
display-name: Charmed MySQL K8s
summary: Charmed MySQL K8s operator
description: |
  MySQL is a widely used, open-source relational database management system
  (RDBMS). MySQL InnoDB cluster provide a complete high availability solution
  for MySQL via Group Replication.

  This charm supports MySQL 8.4 in Kubernetes environments.
docs: https://canonical-charmed-mysql-k8s.readthedocs-hosted.com/
source: https://github.com/canonical/mysql-operators
issues: https://github.com/canonical/mysql-operators/issues
website:
  - https://ubuntu.com/data/mysql
  - https://charmhub.io/mysql-k8s
  - https://github.com/canonical/mysql-operators
maintainers:
  - Canonical Data Platform <data-platform@lists.launchpad.net>

containers:
  mysql:
    resource: mysql-image
    mounts:
      - storage: database
        location: /var/lib/mysql

resources:
  mysql-image:
    type: oci-image
    description: Ubuntu LTS Docker image for MySQL
    upstream-source: ghcr.io/canonical/charmed-mysql@sha256:5e3ab326cb01f31a9e096ada50cb87ebd27671a990ad5e4f565ca5d1e5c48a3b

peers:
  database-peers:
    interface: mysql_peers
  upgrade:
    interface: upgrade
  restart:
    interface: rolling_op

provides:
  database:
    interface: mysql_client
  metrics-endpoint:
    interface: prometheus_scrape
    optional: true
  grafana-dashboard:
    interface: grafana_dashboard
    optional: true
  replication-offer:
    interface: mysql_async
    optional: true
    limit: 1

requires:
  certificates:
    interface: tls-certificates
    limit: 1
    optional: true
  s3-parameters:
    interface: s3
    limit: 1
    optional: true
  logging:
    interface: loki_push_api
    limit: 1
    optional: true
  replication:
    interface: mysql_async
    limit: 1
    optional: true
  tracing:
    interface: tracing
    limit: 1
    optional: true

storage:
  database:
    type: filesystem
    description: Persistent storage for MySQL data

assumes:
  - k8s-api
  - any-of:
      - all-of:
          - juju >= 3.6.0
          - juju < 4
