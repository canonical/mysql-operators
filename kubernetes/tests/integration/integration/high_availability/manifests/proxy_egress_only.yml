apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-egress-only
  namespace: $namespace
spec:
  # Every pod of the model, including the ones added by a later scale up
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # The squid proxy and the Kubernetes API both live on the node
    - to:
        - ipBlock:
            cidr: $node_address/32
    # Other pods (the units and the Juju controller) and the cluster services
    - to:
        - ipBlock:
            cidr: $pod_cidr
        - ipBlock:
            cidr: $service_cidr
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
