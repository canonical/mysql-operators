juju:
  # TODO: Remove agent-version pinning
  # when https://github.com/juju/juju/issues/22101 and https://github.com/juju/juju/issues/21664#issuecomment-4141900703
  # are fully addressed
  agent-version: "3.6.19"
  model-defaults:
    logging-config: <root>=INFO; unit=DEBUG
providers:
  lxd:
    enable: true
    bootstrap: true
host:
  snaps:
    jhack:
      channel: latest/edge
      connections:
        - jhack:dot-local-share-juju snapd
