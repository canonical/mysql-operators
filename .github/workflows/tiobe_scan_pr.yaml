# TEMPORARY workflow to test TICS scan changes on the fix/tiobe-machine-issues
# branch before merging.
# TODO: Remove this file before merge.

name: TICS scan (branch)

on:
  push:
    branches:
      - backport/e1f560051-to-8.0-edge

jobs:
  tics:
    name: Tiobe scan
    runs-on: [self-hosted, tiobe]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - operator: machines
            project: mysql-vm-8.0
          - operator: kubernetes
            project: mysql-k8s-8.0
    permissions: {}
    steps:
      - name: Checkout the project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            ${{ matrix.operator }}
            common
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-venv
      - name: Install pipx
        run: python3 -m pip install --user pipx && python3 -m pipx ensurepath
      - name: Add pipx to PATH
        run: echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Install tox and poetry using pipx
        run: |
          pipx install tox
          pipx install poetry
      - name: Create and activate virtual environment
        run: |
          sudo apt update && sudo apt install -y python3-venv
          python3 -m venv .venv
          . .venv/bin/activate
          pip install flake8 poetry pylint pytest tox
          echo PATH="$PATH" >> "$GITHUB_ENV"
      - name: Run tox tests to create coverage.xml
        run: tox run -e unit
      - name: Run coverage tests
        run: |
          tox -e unit -c ${{ matrix.operator }}/tox.ini
      - name: Move results to necessary folder for TICS
        run: |
          mkdir -p ${{ matrix.operator }}/.cover
          mv ${{ matrix.operator }}/coverage.xml ${{ matrix.operator }}/.cover/cobertura.xml
      - name: Run TICS analysis with github-action
        uses: tiobe/tics-github-action@v3
        with:
          mode: qserver
          project: ${{ matrix.project }}
          branchdir: .
          viewerUrl: https://canonical.tiobe.com/tiobeweb/TICS/api/cfg?name=default
          ticsAuthToken: ${{ secrets.TICSAUTHTOKEN }}
          installTics: true
