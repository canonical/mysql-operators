name: Weekly TICS scan

on:
  schedule:
    - cron: "0 2 * * 6" # Every Saturday 2:00 AM UTC
  workflow_dispatch:

jobs:
  TICS:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create and activate virtual environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install coverage flake8 poetry pylint pytest tox
          echo PATH="$PATH" >> "$GITHUB_ENV"

      - name: Run coverage tests
        run: |
          tox -e unit -c kubernetes/tox.ini
          tox -e unit -c machines/tox.ini

      - name: Combine coverage reports for TICS
        run: |
          mkdir -p .cover
          coverage combine kubernetes/.coverage machines/.coverage
          coverage xml -o .cover/cobertura.xml

      - name: TICS GitHub Action
        uses: tiobe/tics-github-action@v3
        with:
          mode: qserver
          project: mysql-operators
          viewerUrl: https://canonical.tiobe.com/tiobeweb/TICS/api/cfg?name=default
          branchdir: ${{ env.GITHUB_WORKSPACE }}
          ticsAuthToken: ${{ secrets.TICSAUTHTOKEN }}  # zizmor: ignore[secrets-outside-env] Organization secret (does not support environments: https://github.com/orgs/community/discussions/15379)
          installTics: true
          calc: ALL
    permissions: {}
