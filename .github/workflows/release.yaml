name: Release to Charmhub

on:
  push:
    branches:
      - '8.4/edge'
    paths-ignore:
      - 'docs/**'
      - '.github/renovate.json5'
      - '.github/workflows/*.yaml'

jobs:
  tag:
    name: Create charm refresh tag
    uses: canonical/data-platform-workflows/.github/workflows/tag_charm_edge.yaml@v48.1.1
    with:
      track: '8.4'
    permissions:
      actions: read
      contents: write  # Needed to create git tag

  build:
    name: Build charm | ${{ matrix.path }}
    needs:
      - tag
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v48.1.1
    with:
      path-to-charm-directory: ${{ matrix.path }}
    permissions:
      actions: read
      contents: read

  integration-test:
    name: Integration tests
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    uses: ./.github/workflows/integration_test.yaml
    with:
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
      path-to-charm-directory: ${{ matrix.path }}
    secrets: inherit
    permissions:
      actions: read

# TODO: Uncomment when MySQL 8.4/stable channel has releases
#  release-test:
#    name: Release tests
#    needs:
#      - build
#    strategy:
#      fail-fast: false
#      matrix:
#        path:
#          - kubernetes
#          - machines
#    uses: ./.github/workflows/release_test.yaml
#    with:
#      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
#      path-to-charm-directory: ${{ matrix.path }}
#    secrets: inherit

  release:
    name: Release charm | ${{ matrix.path }}
    needs:
      - tag
      - build
      - integration-test
      # - release-test
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    uses: canonical/data-platform-workflows/.github/workflows/release_charm_edge.yaml@v48.1.1
    with:
      track: ${{ needs.tag.outputs.track }}
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
      path-to-charm-directory: ${{ matrix.path }}
    secrets:
      charmhub-token: ${{ secrets.CHARMHUB_TOKEN }}
    permissions:
      actions: read    # Needed for GitHub API call to get workflow version
      contents: write  # Needed to create git tags
