name: Pull request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/renovate.json5'

jobs:
  # ---------------------------------------------------------------------------
  # TEMPORARY: All regular jobs below are disabled while we diagnose DNS/k8s
  # bootstrap issues on the new Canonical K8s provider.  They will be
  # re-enabled once the root cause is identified and fixed.
  # ---------------------------------------------------------------------------

  lint:
    # TEMPORARILY DISABLED – see dns-bootstrap-diagnostic job below
    if: false
    name: Lint | ${{ matrix.path }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install terraform
        run: |
          sudo snap install terraform --classic
      - name: Install tox & poetry
        run: |
          pipx install tox
          pipx install poetry
      - name: Run linters
        working-directory: ${{ matrix.path }}
        run: |
          tox run -e lint
          tox run -e lint-terraform

  unit-test:
    # TEMPORARILY DISABLED – see dns-bootstrap-diagnostic job below
    if: false
    name: Unit test | ${{ matrix.path }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install tox & poetry
        run: |
          pipx install tox
          pipx install poetry
      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: tox run -e unit
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          directory: ${{ matrix.path }}

  alert-test:
    # TEMPORARILY DISABLED – see dns-bootstrap-diagnostic job below
    if: false
    name: Test Alert Rules | ${{ matrix.path }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Install prometheus snap
        run: sudo snap install prometheus
      - name: Check validity of prometheus alert rules
        working-directory: ${{ matrix.path }}
        run: promtool check rules src/alert_rules/prometheus/*
      - name: Run unit tests for prometheus alert rules
        working-directory: ${{ matrix.path }}
        run: promtool test rules tests/alerts/*.yaml

  build:
    # TEMPORARILY DISABLED – see dns-bootstrap-diagnostic job below
    if: false
    name: Build charm | ${{ matrix.path }}
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v49.0.1
    with:
      path-to-charm-directory: ${{ matrix.path }}

  integration-test:
    # TEMPORARILY DISABLED – see dns-bootstrap-diagnostic job below
    if: false
    name: Integration tests
    needs:
      - lint
      - unit-test
      - build
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    uses: ./.github/workflows/integration_test.yaml
    with:
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
      path-to-charm-directory: ${{ matrix.path }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # TEMPORARY DIAGNOSTIC JOB
  # Bootstraps Canonical K8s via concierge, runs DNS/network diagnostics, and
  # performs a simple `juju deploy mysql-k8s` to surface DNS issues early.
  # Remove (or gate behind a condition) once the DNS flakiness is resolved.
  # ---------------------------------------------------------------------------
  dns-bootstrap-diagnostic:
    name: "[TEMP DIAG] DNS & K8s Bootstrap"
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Free up disk space
        timeout-minutes: 10
        run: |
          printf '\nDisk usage before cleanup\n'
          df --human-readable
          # Based on https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
          rm -rf /opt/hostedtoolcache/
          printf '\nDisk usage after cleanup\n'
          df --human-readable

      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v6

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update -y
          sudo apt-get install -y dnsutils
          sudo snap install concierge --classic

      - name: Bootstrap cluster via concierge (kubernetes/concierge.yaml)
        timeout-minutes: 45
        id: bootstrap
        run: |
          cd kubernetes
          sudo concierge prepare --trace

      # -----------------------------------------------------------------------
      # Wait for Cilium CNI and CoreDNS to be fully operational before running
      # any DNS tests.  The k8s snap uses Cilium; its BPF service maps take a
      # few extra seconds to be programmed after "k8s status --wait-ready"
      # returns.  Without this gate, DNS tests run too early and time out.
      # -----------------------------------------------------------------------
      - name: Wait for Cilium & CoreDNS readiness
        timeout-minutes: 5
        if: always()
        run: |
          echo "=== Waiting for CoreDNS deployment to roll out ==="
          sudo k8s kubectl -n kube-system rollout status deployment/coredns \
            --timeout=120s || true
          echo "=== Waiting for CoreDNS pods to be Ready ==="
          # Canonical K8s labels CoreDNS pods with k8s-app=coredns (not kube-dns)
          sudo k8s kubectl -n kube-system wait pod \
            -l k8s-app=coredns \
            --for=condition=Ready \
            --timeout=120s || true
          echo "=== Cilium agent pods ==="
          sudo k8s kubectl -n kube-system get pods \
            -l app.kubernetes.io/name=cilium-agent -o wide 2>&1 || true
          echo "=== k8s status after wait ==="
          sudo k8s status || true

      # -----------------------------------------------------------------------
      # Cluster & DNS diagnostics – run unconditionally so we always get a
      # snapshot of the cluster state regardless of what happened above.
      # -----------------------------------------------------------------------
      - name: Cluster & DNS diagnostics (always)
        timeout-minutes: 10
        if: always()
        run: |
          mkdir -p ~/logs

          echo "=== k8s status ===" | tee -a ~/logs/cluster-diag.txt
          sudo k8s status 2>&1 | tee -a ~/logs/cluster-diag.txt || true

          echo "" | tee -a ~/logs/cluster-diag.txt
          echo "=== snap.k8s.* systemd logs ===" | tee -a ~/logs/cluster-diag.txt
          sudo journalctl -u 'snap.k8s.*' -n 300 --no-pager 2>&1 \
            | tee ~/logs/k8s-journalctl.txt || true

          echo "=== kubectl version ===" | tee -a ~/logs/cluster-diag.txt
          # Note: --short was removed in kubectl >=1.28; use plain 'version'
          sudo k8s kubectl version 2>&1 | tee -a ~/logs/cluster-diag.txt || true

          echo "=== kubectl get nodes ===" | tee -a ~/logs/cluster-diag.txt
          sudo k8s kubectl get nodes -o wide 2>&1 | tee -a ~/logs/cluster-diag.txt || true

          echo "=== kubectl get pods -A ===" | tee -a ~/logs/cluster-diag.txt
          sudo k8s kubectl get pods -A -o wide 2>&1 | tee -a ~/logs/cluster-diag.txt || true

          echo "=== kube-system svc/endpoints/endpointslices ===" \
            | tee -a ~/logs/cluster-diag.txt
          sudo k8s kubectl -n kube-system \
            get svc,endpoints,endpointslices -o wide 2>&1 \
            | tee -a ~/logs/cluster-diag.txt || true

          echo "=== CoreDNS logs ===" | tee ~/logs/coredns.txt
          # Canonical K8s labels CoreDNS pods with k8s-app=coredns
          sudo k8s kubectl -n kube-system logs \
            -l k8s-app=coredns --tail=200 2>&1 \
            | tee -a ~/logs/coredns.txt || true
          # Also try app.kubernetes.io/name=coredns as a fallback
          sudo k8s kubectl -n kube-system logs \
            -l app.kubernetes.io/name=coredns --tail=200 2>&1 \
            | tee -a ~/logs/coredns.txt || true

          echo "=== Cilium agent logs ===" | tee -a ~/logs/cluster-diag.txt
          sudo k8s kubectl -n kube-system logs \
            -l app.kubernetes.io/name=cilium-agent --tail=100 2>&1 \
            | tee -a ~/logs/cluster-diag.txt || true

          echo "=== kube-proxy logs ===" | tee -a ~/logs/cluster-diag.txt
          sudo k8s kubectl -n kube-system logs \
            -l k8s-app=kube-proxy --tail=50 2>&1 \
            | tee -a ~/logs/cluster-diag.txt || true

      - name: DNS pod diagnostics – resolv.conf + nslookup (always)
        timeout-minutes: 5
        if: always()
        run: |
          mkdir -p ~/logs
          echo "=== DNS resolution from busybox pod ===" | tee ~/logs/dns-pod-diag.txt

          # Get CoreDNS pod IPs so we can test DNS directly (bypassing service
          # ClusterIP routing) to distinguish CNI issues from CoreDNS issues.
          COREDNS_POD_IPS=$(
            sudo k8s kubectl -n kube-system get pods -l k8s-app=coredns \
              -o jsonpath='{range .items[*]}{.status.podIP}{"\n"}{end}' 2>/dev/null \
              | head -1
          )
          echo "CoreDNS pod IP: ${COREDNS_POD_IPS}" | tee -a ~/logs/dns-pod-diag.txt

          # Clean up any prior attempt first
          sudo k8s kubectl delete pod dns-diag --ignore-not-found=true || true
          sudo k8s kubectl run dns-diag \
            --image=busybox:1.36 \
            --restart=Never \
            --rm \
            -i \
            --timeout=120s \
            -- sh -c "
              echo '=== /etc/resolv.conf ==='
              cat /etc/resolv.conf
              echo ''
              echo '=== nslookup kubernetes.default.svc.cluster.local ==='
              nslookup kubernetes.default.svc.cluster.local \
                || echo 'FAILED: kubernetes.default.svc.cluster.local'
              echo ''
              echo '=== nslookup controller-service.controller-concierge-k8s.svc.cluster.local ==='
              nslookup controller-service.controller-concierge-k8s.svc.cluster.local \
                || echo 'FAILED: controller-service.controller-concierge-k8s.svc.cluster.local'
              echo ''
              echo '=== nslookup api.charmhub.io ==='
              nslookup api.charmhub.io || echo 'FAILED: api.charmhub.io'
              echo ''
              if [ -n '${COREDNS_POD_IPS}' ]; then
                echo '=== nslookup direct to CoreDNS pod IP ==='
                nslookup kubernetes.default.svc.cluster.local '${COREDNS_POD_IPS}' \
                  || echo 'FAILED: direct CoreDNS pod IP lookup'
              fi
            " 2>&1 | tee -a ~/logs/dns-pod-diag.txt || true

      # -----------------------------------------------------------------------
      # NOTE: Concierge bootstraps Juju as the 'runner' user (sudo -u runner).
      # Juju data lives in /home/runner/.local/share/juju.  Running 'sudo juju'
      # would use root's home and find no controllers.  Use plain 'juju' here.
      # -----------------------------------------------------------------------
      - name: Deploy mysql-k8s from charmhub (8.4/edge)
        timeout-minutes: 5
        id: deploy
        run: |
          # Deploy 3 units to mirror production-like HA setup; 8.4/edge is the
          # branch under test.  Deploying from charmhub avoids the build step
          # so this diagnostic job can run as early as possible.
          juju switch testing
          juju deploy mysql-k8s --trust -n 3 --channel 8.4/edge

      - name: Wait for mysql-k8s deployment (up to 25 min)
        timeout-minutes: 30
        id: wait-deploy
        run: |
          juju wait-for application mysql-k8s --timeout=25m \
            || echo "wait-for exited with non-zero (timed out or unsupported); collecting logs regardless"

      - name: Juju status & debug-log (always)
        timeout-minutes: 8
        if: always()
        run: |
          mkdir -p ~/logs
          juju show-controller 2>&1 | tee ~/logs/juju-show-controller.txt || true
          juju show-model 2>&1 | tee ~/logs/juju-show-model.txt || true
          juju status --relations --storage --format yaml 2>&1 \
            | tee ~/logs/juju-status.yaml || true
          juju status --color --relations 2>&1 \
            | tee ~/logs/juju-status.txt || true
          juju debug-log --ms --replay --no-tail 2>&1 \
            | tee ~/logs/juju-debug-log.txt || true
          juju debug-log --ms -m controller --replay --no-tail 2>&1 \
            | tee ~/logs/juju-debug-log-controller.txt || true

      - name: Kubectl describe Juju controller & unit pods (always)
        timeout-minutes: 5
        if: always()
        run: |
          mkdir -p ~/logs
          sudo k8s kubectl get pods -A -o wide 2>&1 \
            | tee ~/logs/kubectl-all-pods-final.txt || true
          sudo k8s kubectl -n controller-concierge-k8s describe pod 2>&1 \
            | tee ~/logs/kubectl-describe-controller-pods.txt || true
          sudo k8s kubectl -n testing describe pod 2>&1 \
            | tee ~/logs/kubectl-describe-testing-pods.txt || true

      # -----------------------------------------------------------------------
      # Extended netshoot diagnostics – only on failure, to keep normal runs
      # fast and to avoid pulling a large image unnecessarily.
      # -----------------------------------------------------------------------
      - name: Extended netshoot DNS diagnostics (on failure)
        timeout-minutes: 5
        if: failure()
        run: |
          mkdir -p ~/logs
          # In Canonical K8s the DNS service is named 'coredns', not 'kube-dns'
          DNS_SVC_IP=$(
            sudo k8s kubectl -n kube-system get svc coredns \
              -o jsonpath='{.spec.clusterIP}' 2>/dev/null || echo ""
          )
          echo "DNS Service IP (coredns): ${DNS_SVC_IP}" | tee ~/logs/netshoot-diag.txt
          if [ -n "${DNS_SVC_IP}" ]; then
            sudo k8s kubectl delete pod netshoot-diag --ignore-not-found=true || true
            sudo k8s kubectl run netshoot-diag \
              --image=nicolaka/netshoot:latest \
              --restart=Never \
              --rm \
              -i \
              --timeout=120s \
              -- bash -c "
                echo '=== dig UDP: kubernetes.default.svc.cluster.local ==='
                dig +time=3 +tries=1 @${DNS_SVC_IP} \
                  kubernetes.default.svc.cluster.local A || true
                echo '=== dig TCP: kubernetes.default.svc.cluster.local ==='
                dig +tcp +time=3 +tries=1 @${DNS_SVC_IP} \
                  kubernetes.default.svc.cluster.local A || true
                echo '=== dig api.charmhub.io ==='
                dig +time=3 +tries=1 @${DNS_SVC_IP} api.charmhub.io A || true
                echo '=== ip link ==='
                ip link
                echo '=== ip route ==='
                ip route
              " 2>&1 | tee -a ~/logs/netshoot-diag.txt || true
          fi

      - name: Upload diagnostic logs
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dns-bootstrap-diagnostic-logs
          path: ~/logs/
          if-no-files-found: warn