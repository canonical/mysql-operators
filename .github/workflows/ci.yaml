name: Pull request

# DEBUG: stripped to bare integration tests only (no lint/build/unit-test)
# Deploys from 8.4/edge, kubernetes only.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/renovate.json5'

jobs:
  integration-test:
    name: Integration tests
    uses: ./.github/workflows/integration_test.yaml
    with:
      artifact-prefix: ""
      path-to-charm-directory: kubernetes
    secrets: inherit