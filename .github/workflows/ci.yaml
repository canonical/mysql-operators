name: Pull request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/renovate.json5'

jobs:
  lint-workflows:
    name: Lint workflows
    uses: canonical/data-platform-workflows/.github/workflows/lint_workflows.yaml@v53
    permissions:
      contents: read
    cache-mode: none

  lint-terraform:
    name: Lint terraform | ${{ matrix.path }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install terraform
        run: |
          sudo snap install terraform --classic
      - name: Install tox
        run: |
          pipx install tox
      - name: Run linters
        working-directory: ${{ matrix.path }}
        run: |
          tox run -e lint-terraform
    cache-mode: none

  lint:
    name: Lint | ${{ matrix.path }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        path:
          - common
          - kubernetes
          - machines
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install tox & poetry
        run: |
          pipx install tox
          pipx install poetry
      - name: Run linters
        working-directory: ${{ matrix.path }}
        run: |
          tox run -e lint
    cache-mode: none

  build:
    name: Build charm | ${{ matrix.path }}
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v53
    with:
      path-to-charm-directory: ${{ matrix.path }}
    permissions:
      contents: read
    cache-mode: none

  alert-test:
    name: Test Alert Rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install prometheus snap
        run: |
          sudo snap install prometheus
      - name: Check validity of prometheus alert rules
        run: |
          promtool check rules common/src/single_kernel/resources/observability/prometheus_rules/*
      - name: Run validations for prometheus alert rules
        run: |
          promtool test rules common/tests/alerts/*.yaml
    cache-mode: none

  integration-test:
    name: Integration tests
    needs:
      - lint
      - build
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    uses: $/.github/workflows/integration_test.yaml
    with:
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
      path-to-charm-directory: ${{ matrix.path }}
    secrets:
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
      GCP_ACCESS_KEY: ${{ secrets.GCP_ACCESS_KEY }}
      GCP_SECRET_KEY: ${{ secrets.GCP_SECRET_KEY }}
      UBUNTU_PRO_TOKEN: ${{ secrets.UBUNTU_PRO_TOKEN }}
      LANDSCAPE_ACCOUNT_NAME: ${{ secrets.LANDSCAPE_ACCOUNT_NAME }}
      LANDSCAPE_REGISTRATION_KEY: ${{ secrets.LANDSCAPE_REGISTRATION_KEY }}
    permissions: {}
    cache-mode: none
