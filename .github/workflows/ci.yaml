name: Pull request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/renovate.json5'

jobs:
  # ---------------------------------------------------------------------------
  # TEMPORARY: All regular jobs below are disabled while we diagnose DNS/k8s
  # bootstrap issues on the new Canonical K8s provider.  They will be
  # re-enabled once the root cause is identified and fixed.
  # ---------------------------------------------------------------------------

  lint:
    # TEMPORARILY DISABLED – see dns-bootstrap-diagnostic job below
    if: false
    name: Lint | ${{ matrix.path }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install terraform
        run: |
          sudo snap install terraform --classic
      - name: Install tox & poetry
        run: |
          pipx install tox
          pipx install poetry
      - name: Run linters
        working-directory: ${{ matrix.path }}
        run: |
          tox run -e lint
          tox run -e lint-terraform

  unit-test:
    # TEMPORARILY DISABLED – see dns-bootstrap-diagnostic job below
    if: false
    name: Unit test | ${{ matrix.path }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install tox & poetry
        run: |
          pipx install tox
          pipx install poetry
      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: tox run -e unit
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          directory: ${{ matrix.path }}

  alert-test:
    # TEMPORARILY DISABLED – see dns-bootstrap-diagnostic job below
    if: false
    name: Test Alert Rules | ${{ matrix.path }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Install prometheus snap
        run: sudo snap install prometheus
      - name: Check validity of prometheus alert rules
        working-directory: ${{ matrix.path }}
        run: promtool check rules src/alert_rules/prometheus/*
      - name: Run unit tests for prometheus alert rules
        working-directory: ${{ matrix.path }}
        run: promtool test rules tests/alerts/*.yaml

  build:
    # TEMPORARILY DISABLED – see dns-bootstrap-diagnostic job below
    if: false
    name: Build charm | ${{ matrix.path }}
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v49.0.1
    with:
      path-to-charm-directory: ${{ matrix.path }}

  integration-test:
    # TEMPORARILY DISABLED – see dns-bootstrap-diagnostic job below
    if: false
    name: Integration tests
    needs:
      - lint
      - unit-test
      - build
    strategy:
      fail-fast: false
      matrix:
        path:
          - kubernetes
          - machines
    uses: ./.github/workflows/integration_test.yaml
    with:
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
      path-to-charm-directory: ${{ matrix.path }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # TEMPORARY DIAGNOSTIC JOB
  # Bootstraps Canonical K8s via concierge, runs DNS/network diagnostics, and
  # performs a simple `juju deploy mysql-k8s` to surface DNS issues early.
  # Remove (or gate behind a condition) once the DNS flakiness is resolved.
  # ---------------------------------------------------------------------------
  dns-bootstrap-diagnostic:
    name: "[TEMP DIAG] DNS & K8s Bootstrap"
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Free up disk space
        timeout-minutes: 10
        run: |
          printf '\nDisk usage before cleanup\n'
          df --human-readable
          # Based on https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
          rm -rf /opt/hostedtoolcache/
          printf '\nDisk usage after cleanup\n'
          df --human-readable

      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v6

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update -y
          sudo apt-get install -y dnsutils
          sudo snap install concierge --classic

      # -----------------------------------------------------------------------
      # Fix for systemd-resolved stub DNS → CoreDNS forwarding loop:
      #
      # GitHub Actions runners use systemd-resolved in stub mode.  The host's
      # /etc/resolv.conf is a symlink to /run/systemd/resolve/stub-resolv.conf,
      # which contains "nameserver 127.0.0.53" (the systemd-resolved loopback
      # stub listener).  The actual upstream DNS (e.g. Azure's 168.63.129.16)
      # is only accessible via the host's 127.0.0.53 proxy.
      #
      # Canonical K8s deploys CoreDNS with dnsPolicy: Default so it does not
      # use itself as upstream (avoiding a circular dependency).  With Default,
      # CoreDNS pods inherit the node's /etc/resolv.conf.  Their Corefile uses
      # "forward . /etc/resolv.conf", which reads 127.0.0.53 as the upstream.
      #
      # From inside a pod's network namespace, 127.0.0.53 is the pod's own
      # loopback – there is no DNS server listening there.  CoreDNS therefore
      # cannot forward external queries and returns SERVFAIL for every non-
      # cluster name (e.g. "api.charmhub.io").  Internal cluster.local names
      # still work because CoreDNS serves them directly via the kubernetes
      # plugin without hitting the forward plugin.
      #
      # Fix: before k8s bootstraps (so all CoreDNS pods inherit the corrected
      # file from first start), switch /etc/resolv.conf from the stub variant
      # to the "uplink" variant that lists the real upstream DNS server IPs.
      # This is the standard Kubernetes pre-flight recommendation for nodes
      # that run systemd-resolved in stub mode.
      # -----------------------------------------------------------------------
      - name: Fix systemd-resolved stub - point /etc/resolv.conf at real upstream DNS
        timeout-minutes: 2
        run: |
          echo "=== /etc/resolv.conf before fix ==="
          cat /etc/resolv.conf

          echo "=== Switching /etc/resolv.conf to uplink (real upstream IPs) ==="
          # /run/systemd/resolve/resolv.conf contains the real upstream DNS
          # servers (not the 127.0.0.53 stub).
          sudo ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf

          echo "=== /etc/resolv.conf after fix ==="
          cat /etc/resolv.conf

          echo "=== Verifying external DNS from host now works ==="
          nslookup api.charmhub.io || true

      - name: Bootstrap cluster via concierge (kubernetes/concierge.yaml)
        timeout-minutes: 45
        id: bootstrap
        run: |
          cd kubernetes
          sudo concierge prepare --trace

      # -----------------------------------------------------------------------
      # Fix for Cilium CNI race condition:
      #
      # When the k8s snap bootstraps, CoreDNS pods can start before Cilium has
      # become the active CNI plugin.  Those early pods get IPs from containerd's
      # fallback bridge CNI (10.88.0.0/16) instead of Cilium's pod CIDR
      # (10.1.0.0/16).  Cilium's BPF kube-proxy replacement then programs the
      # coredns service ClusterIP with BOTH backends, but traffic DNAT'd to a
      # bridge-network IP is silently dropped because Cilium has no BPF endpoint
      # map for those addresses.  This produces ~50% DNS timeout failures (the
      # exact error seen: "i/o timeout" on the CoreDNS ClusterIP).
      #
      # Fix: after Cilium is fully Ready, restart CoreDNS so every pod lands on
      # the Cilium network.  Then gate on an active ClusterIP DNS probe from
      # inside the cluster – pod readiness alone is not a sufficient signal.
      # -----------------------------------------------------------------------
      - name: Fix Cilium/CoreDNS CNI race - restart CoreDNS after Cilium is ready
        timeout-minutes: 10
        run: |
          echo "=== Waiting for Cilium agent to be Ready ==="
          sudo k8s kubectl -n kube-system wait pod \
            -l app.kubernetes.io/name=cilium-agent \
            --for=condition=Ready \
            --timeout=120s

          echo "=== CoreDNS endpoints before restart ==="
          sudo k8s kubectl -n kube-system get endpoints coredns -o wide

          echo "=== Restarting CoreDNS to flush any pre-Cilium bridge IPs ==="
          sudo k8s kubectl -n kube-system rollout restart deployment/coredns

          echo "=== Waiting for CoreDNS rollout to complete ==="
          sudo k8s kubectl -n kube-system rollout status deployment/coredns \
            --timeout=120s

          echo "=== Waiting for all CoreDNS pods to be Ready ==="
          sudo k8s kubectl -n kube-system wait pod \
            -l k8s-app=coredns \
            --for=condition=Ready \
            --timeout=120s

          echo "=== CoreDNS endpoints after restart (all should be 10.1.x.x) ==="
          sudo k8s kubectl -n kube-system get endpoints coredns -o wide

          DNS_SVC_IP=$(
            sudo k8s kubectl -n kube-system get svc coredns \
              -o jsonpath='{.spec.clusterIP}'
          )
          echo "CoreDNS ClusterIP: ${DNS_SVC_IP}"

          echo "=== Active ClusterIP DNS gate (internal name) ==="
          # Run a busybox pod and retry until ClusterIP DNS resolves or timeout.
          # This confirms Cilium BPF service maps are programmed correctly.
          # NOTE: nslookup always prints "Address: <server>:<port>" for the server
          # itself; use "grep -q '^Name:'" to detect an actual resolved answer.
          sudo k8s kubectl delete pod dns-gate --ignore-not-found=true || true
          for attempt in $(seq 1 12); do
            echo "Attempt ${attempt}/12: testing ClusterIP DNS (internal)..."
            result=$(
              sudo k8s kubectl run dns-gate \
                --image=busybox:1.36 \
                --restart=Never \
                --rm \
                -i \
                --timeout=30s \
                -- sh -c "nslookup kubernetes.default.svc.cluster.local ${DNS_SVC_IP}" \
                2>&1 || true
            )
            echo "${result}"
            if echo "${result}" | grep -q "^Name:"; then
              echo "=== ClusterIP DNS gate passed on attempt ${attempt} ==="
              break
            fi
            if [ "${attempt}" -eq 12 ]; then
              echo "=== ClusterIP DNS gate FAILED after 12 attempts ==="
              exit 1
            fi
            echo "DNS not yet responding via ClusterIP, waiting 10s..."
            sleep 10
          done

          echo "=== k8s status ==="
          sudo k8s status

          # -------------------------------------------------------------------
          # Fix for Azure DNS not being reachable from Cilium pod overlay IPs:
          #
          # The uplink resolv.conf fix (step above) correctly gives CoreDNS pods
          # /etc/resolv.conf with "nameserver 168.63.129.16" (Azure internal DNS).
          # However, 168.63.129.16 is Azure's "magic" link-local DNS address –
          # it only responds to queries originating from the VM's real eth0 IP.
          # Cilium pod IPs (10.1.0.x) are on an overlay network and Azure rejects
          # (SERVFAIL) queries from those IPs.  This means CoreDNS cannot forward
          # any external name (e.g. api.charmhub.io) even with the resolv.conf
          # fix in place.
          #
          # Fix: patch the CoreDNS Corefile to use public DNS resolvers (8.8.8.8,
          # 1.1.1.1) instead of /etc/resolv.conf.  Public resolvers are reachable
          # from pod overlay IPs via Cilium's masquerade (SNAT) to the node IP.
          # -------------------------------------------------------------------
          echo "=== Patching CoreDNS Corefile: forward to 8.8.8.8 1.1.1.1 ==="
          COREDNS_CM=$(
            sudo k8s kubectl -n kube-system get configmap \
              -l app.kubernetes.io/instance=ck-dns \
              -o jsonpath='{.items[0].metadata.name}'
          )
          echo "CoreDNS ConfigMap name: ${COREDNS_CM}"
          sudo k8s kubectl -n kube-system get configmap "${COREDNS_CM}" \
            -o jsonpath='{.data.Corefile}'
          # Replace "forward . /etc/resolv.conf" with public resolvers.
          PATCHED_COREFILE=$(
            sudo k8s kubectl -n kube-system get configmap "${COREDNS_CM}" \
              -o jsonpath='{.data.Corefile}' \
              | sed 's|forward \. /etc/resolv.conf|forward . 8.8.8.8 1.1.1.1|'
          )
          sudo k8s kubectl -n kube-system patch configmap "${COREDNS_CM}" \
            --type merge \
            -p "{\"data\":{\"Corefile\":$(echo "${PATCHED_COREFILE}" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}}"
          echo "=== CoreDNS Corefile after patch ==="
          sudo k8s kubectl -n kube-system get configmap "${COREDNS_CM}" \
            -o jsonpath='{.data.Corefile}'
          # CoreDNS reloads its config automatically (reload plugin is enabled).
          # Wait a few seconds for the reload to take effect.
          sleep 10
          echo "=== Restarting CoreDNS to ensure Corefile reload ==="
          sudo k8s kubectl -n kube-system rollout restart deployment/coredns
          sudo k8s kubectl -n kube-system rollout status deployment/coredns \
            --timeout=60s
          sudo k8s kubectl -n kube-system wait pod \
            -l k8s-app=coredns \
            --for=condition=Ready \
            --timeout=60s

          # Re-run the ClusterIP DNS gate after the second CoreDNS restart.
          # The Corefile-patch restart can trigger the same Cilium bridge-IP race
          # as the initial restart: if a new CoreDNS pod gets a bridge IP (10.88.x)
          # instead of a Cilium IP (10.1.x), Cilium silently drops traffic to it
          # via the ClusterIP.  Wait for the gate to confirm Cilium service maps are
          # programmed before proceeding to the external DNS test.
          echo "=== ClusterIP DNS gate after Corefile-patch restart ==="
          sudo k8s kubectl delete pod dns-gate-post-patch --ignore-not-found=true || true
          for attempt in $(seq 1 12); do
            echo "Attempt ${attempt}/12: testing ClusterIP DNS after patch restart..."
            result=$(
              sudo k8s kubectl run dns-gate-post-patch \
                --image=busybox:1.36 \
                --restart=Never \
                --rm \
                -i \
                --timeout=30s \
                -- sh -c "nslookup kubernetes.default.svc.cluster.local ${DNS_SVC_IP}" \
                2>&1 || true
            )
            echo "${result}"
            if echo "${result}" | grep -q "^Name:"; then
              echo "=== Post-patch ClusterIP DNS gate passed on attempt ${attempt} ==="
              break
            fi
            if [ "${attempt}" -eq 12 ]; then
              echo "=== Post-patch ClusterIP DNS gate FAILED after 12 attempts ==="
              exit 1
            fi
            echo "ClusterIP DNS not yet responding after patch restart, waiting 10s..."
            sleep 10
          done

          # -------------------------------------------------------------------
          # Fix for pod egress masquerade (Root Cause 4):
          #
          # Even with the CoreDNS Corefile patched to use 8.8.8.8/1.1.1.1, pods
          # cannot reach external IPs.  The symptom is "connection timed out" (not
          # SERVFAIL) when querying 8.8.8.8:53 directly from a pod.  This proves
          # the problem is NOT DNS configuration — it is network layer egress.
          #
          # Cause: Cilium masquerade (SNAT) is not applied to pod→external traffic.
          # Without SNAT, pod packets leave the node with source IP 10.1.x.x
          # (private overlay range).  Azure's fabric drops return traffic because
          # it has no route back to 10.1.x.x from the internet.
          #
          # Fix: add explicit iptables MASQUERADE rules for the pod and service
          # CIDRs on the node's default egress interface.  These rules fire in
          # iptables POSTROUTING and do not conflict with Cilium's own BPF
          # masquerade (if BPF masquerade is active, Cilium handles the SNAT in
          # BPF before the packet reaches iptables POSTROUTING; the rule is a
          # no-op in that case and harms nothing).
          # -------------------------------------------------------------------
          echo "=== Adding iptables MASQUERADE for pod/service egress ==="
          MAIN_IF=$(ip route show default | awk '{print $5}' | head -1)
          POD_CIDR=$(
            sudo k8s kubectl get nodes \
              -o jsonpath='{.items[0].spec.podCIDR}' 2>/dev/null \
              || echo "10.1.0.0/16"
          )
          echo "Main interface: ${MAIN_IF}"
          echo "Pod CIDR: ${POD_CIDR}"
          # Add MASQUERADE for pod CIDR going out via the main interface.
          # -C checks if the rule already exists before adding it.
          sudo iptables -t nat -C POSTROUTING \
            -s "${POD_CIDR}" -o "${MAIN_IF}" -j MASQUERADE 2>/dev/null \
            || sudo iptables -t nat -A POSTROUTING \
                 -s "${POD_CIDR}" -o "${MAIN_IF}" -j MASQUERADE
          echo "=== iptables POSTROUTING rules (NAT) ==="
          sudo iptables -t nat -L POSTROUTING -n -v

          echo "=== External DNS gate (api.charmhub.io must resolve before deploy) ==="
          # Verify that external DNS forwarding via 8.8.8.8/1.1.1.1 works.
          sudo k8s kubectl delete pod dns-gate-ext --ignore-not-found=true || true
          for attempt in $(seq 1 12); do
            echo "Attempt ${attempt}/12: testing external DNS..."
            result=$(
              sudo k8s kubectl run dns-gate-ext \
                --image=busybox:1.36 \
                --restart=Never \
                --rm \
                -i \
                --timeout=30s \
                -- sh -c "nslookup api.charmhub.io ${DNS_SVC_IP}" \
                2>&1 || true
            )
            echo "${result}"
            # "^Name:" only appears when the hostname was actually resolved.
            if echo "${result}" | grep -q "^Name:"; then
              echo "=== External DNS gate passed on attempt ${attempt} ==="
              break
            fi
            if [ "${attempt}" -eq 12 ]; then
              echo "=== External DNS gate FAILED after 12 attempts ==="
              exit 1
            fi
            echo "External DNS not yet responding, waiting 10s..."
            sleep 10
          done

      # -----------------------------------------------------------------------
      # Cluster & DNS diagnostics – run unconditionally so we always get a
      # snapshot of the cluster state regardless of what happened above.
      # -----------------------------------------------------------------------
      - name: Cluster & DNS diagnostics (always)
        timeout-minutes: 10
        if: always()
        run: |
          mkdir -p ~/logs

          echo "=== k8s status ===" | tee -a ~/logs/cluster-diag.txt
          sudo k8s status 2>&1 | tee -a ~/logs/cluster-diag.txt || true

          echo "" | tee -a ~/logs/cluster-diag.txt
          echo "=== snap.k8s.* systemd logs ===" | tee -a ~/logs/cluster-diag.txt
          sudo journalctl -u 'snap.k8s.*' -n 300 --no-pager 2>&1 \
            | tee ~/logs/k8s-journalctl.txt || true

          echo "=== kubectl version ===" | tee -a ~/logs/cluster-diag.txt
          # Note: --short was removed in kubectl >=1.28; use plain 'version'
          sudo k8s kubectl version 2>&1 | tee -a ~/logs/cluster-diag.txt || true

          echo "=== kubectl get nodes ===" | tee -a ~/logs/cluster-diag.txt
          sudo k8s kubectl get nodes -o wide 2>&1 | tee -a ~/logs/cluster-diag.txt || true

          echo "=== kubectl get pods -A ===" | tee -a ~/logs/cluster-diag.txt
          sudo k8s kubectl get pods -A -o wide 2>&1 | tee -a ~/logs/cluster-diag.txt || true

          echo "=== kube-system svc/endpoints/endpointslices ===" \
            | tee -a ~/logs/cluster-diag.txt
          sudo k8s kubectl -n kube-system \
            get svc,endpoints,endpointslices -o wide 2>&1 \
            | tee -a ~/logs/cluster-diag.txt || true

          echo "=== CoreDNS logs ===" | tee ~/logs/coredns.txt
          # Canonical K8s labels CoreDNS pods with k8s-app=coredns
          sudo k8s kubectl -n kube-system logs \
            -l k8s-app=coredns --tail=200 2>&1 \
            | tee -a ~/logs/coredns.txt || true
          # Also try app.kubernetes.io/name=coredns as a fallback
          sudo k8s kubectl -n kube-system logs \
            -l app.kubernetes.io/name=coredns --tail=200 2>&1 \
            | tee -a ~/logs/coredns.txt || true

          echo "=== Cilium agent logs ===" | tee -a ~/logs/cluster-diag.txt
          sudo k8s kubectl -n kube-system logs \
            -l app.kubernetes.io/name=cilium-agent --tail=100 2>&1 \
            | tee -a ~/logs/cluster-diag.txt || true

          echo "" | tee -a ~/logs/cluster-diag.txt
          echo "=== Cilium status ===" | tee -a ~/logs/cluster-diag.txt
          CILIUM_POD=$(
            sudo k8s kubectl -n kube-system get pods \
              -l app.kubernetes.io/name=cilium-agent \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo ""
          )
          if [ -n "${CILIUM_POD}" ]; then
            sudo k8s kubectl -n kube-system exec "${CILIUM_POD}" \
              -- cilium status --verbose 2>&1 \
              | tee -a ~/logs/cluster-diag.txt || true
            echo "=== Cilium config (masquerade-related) ===" \
              | tee -a ~/logs/cluster-diag.txt
            sudo k8s kubectl -n kube-system exec "${CILIUM_POD}" \
              -- cilium config 2>&1 \
              | grep -iE "masquerad|snat|tunnel|native-routing|bpf-masq" \
              | tee -a ~/logs/cluster-diag.txt || true
          fi

          echo "" | tee -a ~/logs/cluster-diag.txt
          echo "=== iptables NAT POSTROUTING rules ===" | tee -a ~/logs/cluster-diag.txt
          sudo iptables -t nat -L POSTROUTING -n -v 2>&1 \
            | tee -a ~/logs/cluster-diag.txt || true

          echo "=== kube-proxy logs ===" | tee -a ~/logs/cluster-diag.txt
          sudo k8s kubectl -n kube-system logs \
            -l k8s-app=kube-proxy --tail=50 2>&1 \
            | tee -a ~/logs/cluster-diag.txt || true

          # -----------------------------------------------------------------
          # CoreDNS upstream-forwarding diagnostics.
          #
          # Hypothesis: k8s snap reconfigures the host's system DNS to route
          # queries through systemd-resolved → CoreDNS ClusterIP.  If the
          # CoreDNS Corefile uses "forward . /etc/resolv.conf", the pods
          # inherit whatever is in the host's resolv.conf at pod-start time.
          # If that file contains 127.0.0.53 (systemd-resolved loopback) or
          # the ClusterIP itself, CoreDNS loops and returns SERVFAIL for all
          # external names.
          # -----------------------------------------------------------------

          echo "=== HOST /etc/resolv.conf ===" | tee ~/logs/dns-upstream-diag.txt
          cat /etc/resolv.conf 2>&1 | tee -a ~/logs/dns-upstream-diag.txt || true

          echo "" | tee -a ~/logs/dns-upstream-diag.txt
          echo "=== systemd-resolved / resolvectl status ===" \
            | tee -a ~/logs/dns-upstream-diag.txt
          resolvectl status 2>&1 \
            | tee -a ~/logs/dns-upstream-diag.txt || true

          echo "" | tee -a ~/logs/dns-upstream-diag.txt
          echo "=== CoreDNS ConfigMap (Corefile) ===" \
            | tee -a ~/logs/dns-upstream-diag.txt
          # Canonical K8s deploys CoreDNS via Helm (release: ck-dns).
          # The ConfigMap is NOT named "coredns"; list all and grep for it.
          sudo k8s kubectl -n kube-system get configmap 2>&1 \
            | tee -a ~/logs/dns-upstream-diag.txt || true
          # Dump the ck-dns ConfigMap (contains the Corefile)
          sudo k8s kubectl -n kube-system get configmap \
            -l app.kubernetes.io/instance=ck-dns -o yaml 2>&1 \
            | tee -a ~/logs/dns-upstream-diag.txt || true

          echo "" | tee -a ~/logs/dns-upstream-diag.txt
          echo "=== CoreDNS pod dnsPolicy + /etc/resolv.conf inside pod ===" \
            | tee -a ~/logs/dns-upstream-diag.txt
          COREDNS_POD=$(
            sudo k8s kubectl -n kube-system get pods -l k8s-app=coredns \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo ""
          )
          if [ -n "${COREDNS_POD}" ]; then
            echo "CoreDNS pod: ${COREDNS_POD}" \
              | tee -a ~/logs/dns-upstream-diag.txt
            sudo k8s kubectl -n kube-system get pod "${COREDNS_POD}" \
              -o jsonpath='{.spec.dnsPolicy}{"\n"}' 2>&1 \
              | tee -a ~/logs/dns-upstream-diag.txt || true
            # Note: CoreDNS image is distroless (no shell or cat).
            # Read the resolv.conf via /proc instead.
            COREDNS_PID=$(
              sudo k8s kubectl -n kube-system get pod "${COREDNS_POD}" \
                -o jsonpath='{.status.containerStatuses[0].containerID}' 2>/dev/null \
                | sed 's|containerd://||' || echo ""
            )
            echo "CoreDNS container ID: ${COREDNS_PID}" \
              | tee -a ~/logs/dns-upstream-diag.txt
            # Get the pod's /etc/resolv.conf from the container's mount namespace.
            sudo k8s kubectl -n kube-system debug -it "${COREDNS_POD}" \
              --image=busybox:1.36 \
              --target=coredns \
              -- cat /etc/resolv.conf 2>&1 \
              | tee -a ~/logs/dns-upstream-diag.txt || true

            echo "" | tee -a ~/logs/dns-upstream-diag.txt
            echo "=== Test external DNS from host pointing at CoreDNS pod directly ===" \
              | tee -a ~/logs/dns-upstream-diag.txt
            COREDNS_POD_IP=$(
              sudo k8s kubectl -n kube-system get pod "${COREDNS_POD}" \
                -o jsonpath='{.status.podIP}' 2>/dev/null || echo ""
            )
            if [ -n "${COREDNS_POD_IP}" ]; then
              nslookup api.charmhub.io "${COREDNS_POD_IP}" 2>&1 \
                | tee -a ~/logs/dns-upstream-diag.txt || true
            fi
          fi

          echo "" | tee -a ~/logs/dns-upstream-diag.txt
          echo "=== Cilium network policies (CiliumNetworkPolicy) ===" \
            | tee -a ~/logs/dns-upstream-diag.txt
          sudo k8s kubectl get ciliumnetworkpolicies -A 2>&1 \
            | tee -a ~/logs/dns-upstream-diag.txt || true

      - name: DNS pod diagnostics - resolv.conf + nslookup (always)
        timeout-minutes: 5
        if: always()
        run: |
          mkdir -p ~/logs
          echo "=== DNS resolution from busybox pod ===" | tee ~/logs/dns-pod-diag.txt

          # Get CoreDNS pod IPs so we can test DNS directly (bypassing service
          # ClusterIP routing) to distinguish CNI issues from CoreDNS issues.
          COREDNS_POD_IPS=$(
            sudo k8s kubectl -n kube-system get pods -l k8s-app=coredns \
              -o jsonpath='{range .items[*]}{.status.podIP}{"\n"}{end}' 2>/dev/null \
              | head -1
          )
          echo "CoreDNS pod IP: ${COREDNS_POD_IPS}" | tee -a ~/logs/dns-pod-diag.txt

          # Clean up any prior attempt first
          sudo k8s kubectl delete pod dns-diag --ignore-not-found=true || true
          sudo k8s kubectl run dns-diag \
            --image=busybox:1.36 \
            --restart=Never \
            --rm \
            -i \
            --timeout=120s \
            -- sh -c "
              echo '=== /etc/resolv.conf ==='
              cat /etc/resolv.conf
              echo ''
              echo '=== nslookup kubernetes.default.svc.cluster.local ==='
              nslookup kubernetes.default.svc.cluster.local \
                || echo 'FAILED: kubernetes.default.svc.cluster.local'
              echo ''
              echo '=== nslookup controller-service.controller-concierge-k8s.svc.cluster.local ==='
              nslookup controller-service.controller-concierge-k8s.svc.cluster.local \
                || echo 'FAILED: controller-service.controller-concierge-k8s.svc.cluster.local'
              echo ''
              echo '=== nslookup api.charmhub.io (via CoreDNS ClusterIP) ==='
              nslookup api.charmhub.io || echo 'FAILED: api.charmhub.io via ClusterIP'
              echo ''
              echo '=== nslookup api.charmhub.io direct to 168.63.129.16 (Azure DNS) ==='
              nslookup api.charmhub.io 168.63.129.16 \
                || echo 'FAILED: api.charmhub.io via 168.63.129.16'
              echo ''
              echo '=== nslookup api.charmhub.io direct to 8.8.8.8 (Google DNS) ==='
              nslookup api.charmhub.io 8.8.8.8 \
                || echo 'FAILED: api.charmhub.io via 8.8.8.8'
              echo ''
              if [ -n "${COREDNS_POD_IPS}" ]; then
                echo '=== nslookup direct to CoreDNS pod IP ==='
                nslookup kubernetes.default.svc.cluster.local "${COREDNS_POD_IPS}" \
                  || echo 'FAILED: direct CoreDNS pod IP lookup'
              fi
            " 2>&1 | tee -a ~/logs/dns-pod-diag.txt || true

      # -----------------------------------------------------------------------
      # NOTE: Concierge bootstraps Juju as the 'runner' user (sudo -u runner).
      # Juju data lives in /home/runner/.local/share/juju.  Running 'sudo juju'
      # would use root's home and find no controllers.  Use plain 'juju' here.
      # -----------------------------------------------------------------------
      - name: Deploy mysql-k8s from charmhub (8.4/edge)
        timeout-minutes: 5
        id: deploy
        run: |
          # Deploy 3 units to mirror production-like HA setup; 8.4/edge is the
          # branch under test.  Deploying from charmhub avoids the build step
          # so this diagnostic job can run as early as possible.
          juju switch testing
          juju deploy mysql-k8s --trust -n 3 --channel 8.4/edge

      - name: Wait for mysql-k8s deployment (up to 25 min)
        timeout-minutes: 30
        id: wait-deploy
        run: |
          juju wait-for application mysql-k8s --timeout=25m \
            || echo "wait-for exited with non-zero (timed out or unsupported); collecting logs regardless"

      - name: Juju status & debug-log (always)
        timeout-minutes: 8
        if: always()
        run: |
          mkdir -p ~/logs
          juju show-controller 2>&1 | tee ~/logs/juju-show-controller.txt || true
          juju show-model 2>&1 | tee ~/logs/juju-show-model.txt || true
          juju status --relations --storage --format yaml 2>&1 \
            | tee ~/logs/juju-status.yaml || true
          juju status --color --relations 2>&1 \
            | tee ~/logs/juju-status.txt || true
          juju debug-log --ms --replay --no-tail 2>&1 \
            | tee ~/logs/juju-debug-log.txt || true
          juju debug-log --ms -m controller --replay --no-tail 2>&1 \
            | tee ~/logs/juju-debug-log-controller.txt || true

      - name: Kubectl describe Juju controller & unit pods (always)
        timeout-minutes: 5
        if: always()
        run: |
          mkdir -p ~/logs
          sudo k8s kubectl get pods -A -o wide 2>&1 \
            | tee ~/logs/kubectl-all-pods-final.txt || true
          sudo k8s kubectl -n controller-concierge-k8s describe pod 2>&1 \
            | tee ~/logs/kubectl-describe-controller-pods.txt || true
          sudo k8s kubectl -n testing describe pod 2>&1 \
            | tee ~/logs/kubectl-describe-testing-pods.txt || true

      # -----------------------------------------------------------------------
      # Extended netshoot diagnostics – only on failure, to keep normal runs
      # fast and to avoid pulling a large image unnecessarily.
      # -----------------------------------------------------------------------
      - name: Extended netshoot DNS diagnostics (on failure)
        timeout-minutes: 5
        if: failure()
        run: |
          mkdir -p ~/logs
          # In Canonical K8s the DNS service is named 'coredns', not 'kube-dns'
          DNS_SVC_IP=$(
            sudo k8s kubectl -n kube-system get svc coredns \
              -o jsonpath='{.spec.clusterIP}' 2>/dev/null || echo ""
          )
          echo "DNS Service IP (coredns): ${DNS_SVC_IP}" | tee ~/logs/netshoot-diag.txt
          if [ -n "${DNS_SVC_IP}" ]; then
            sudo k8s kubectl delete pod netshoot-diag --ignore-not-found=true || true
            sudo k8s kubectl run netshoot-diag \
              --image=nicolaka/netshoot:latest \
              --restart=Never \
              --rm \
              -i \
              --timeout=120s \
              -- bash -c "
                echo '=== dig UDP: kubernetes.default.svc.cluster.local ==='
                dig +time=3 +tries=1 @${DNS_SVC_IP} \
                  kubernetes.default.svc.cluster.local A || true
                echo '=== dig TCP: kubernetes.default.svc.cluster.local ==='
                dig +tcp +time=3 +tries=1 @${DNS_SVC_IP} \
                  kubernetes.default.svc.cluster.local A || true
                echo '=== dig api.charmhub.io via ClusterIP ==='
                dig +time=3 +tries=1 @${DNS_SVC_IP} api.charmhub.io A || true
                echo '=== dig api.charmhub.io direct to 8.8.8.8 ==='
                dig +time=5 +tries=1 @8.8.8.8 api.charmhub.io A || true
                echo '=== ping 8.8.8.8 (ICMP) ==='
                ping -c 2 -W 3 8.8.8.8 || echo 'FAILED: ping 8.8.8.8'
                echo '=== traceroute 8.8.8.8 (max 5 hops) ==='
                traceroute -n -w 2 -m 5 8.8.8.8 || true
                echo '=== ip link ==='
                ip link
                echo '=== ip route ==='
                ip route
              " 2>&1 | tee -a ~/logs/netshoot-diag.txt || true
          fi

      - name: Upload diagnostic logs
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dns-bootstrap-diagnostic-logs
          path: ~/logs/
          if-no-files-found: warn