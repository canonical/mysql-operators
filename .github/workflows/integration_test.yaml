name: Integration tests

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: |
          Prefix for charm package GitHub artifact(s)

          Use canonical/data-platform-workflows build_charm.yaml to build the charm(s)
          Leave empty to skip charm download and deploy from charmhub instead.
        required: false
        default: ""
        type: string
      path-to-charm-directory:
        description: Relative path to charm directory from repository directory
        default: .
        type: string
      juju-channel:
        description: Juju snap channel to use for integration tests
        default: 3.6/stable
        type: string

jobs:
  collect-integration-tests:
    name: Collect integration test jobs | ${{ inputs.path-to-charm-directory }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up environment
        run: |
          pipx install tox
          pipx install poetry
      - name: Collect integration test jobs
        id: collect-jobs
        working-directory: ${{ inputs.path-to-charm-directory }}
        shell: python
        run: |
          import json
          import os

          # DEBUG: hard-coded subset for rapid CI validation
          test_files = [
              ("test_backup_aws.py",    "test_backup_aws.py"),
              ("test_instance_roles.py", "roles/test_instance_roles.py"),
              ("relations/test_database.py", "relations/test_database.py"),
          ]
          architectures = [
              ("ubuntu-24.04",     "amd64"),
              ("ubuntu-24.04-arm", "arm64"),
          ]

          jobs = []
          for task_name, test_module in test_files:
              for runner, architecture in architectures:
                  name = f"{task_name} | {architecture}"
                  name_in_artifact = f"{task_name}-{architecture}".replace("/", "-")
                  jobs.append({
                      "test_module": test_module,
                      "name": name,
                      "name_in_artifact": name_in_artifact,
                      "runner": runner,
                  })

          output = f"jobs={json.dumps(jobs)}"
          print(output)
          with open(os.environ["GITHUB_OUTPUT"], "a") as file:
              file.write(output)
      - name: Generate Allure default test results
        if: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt == '1' }}
        working-directory: ${{ inputs.path-to-charm-directory }}
        run: tox run -e integration -- tests/integration/integration --allure-default-dir=allure-default-results
      - name: Upload Allure default results
        # Default test results in case the integration tests time out or runner set up fails
        # (So that Allure report will show "unknown"/"failed" test result, instead of omitting the test)
        if: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-default-results-integration-test-${{ inputs.path-to-charm-directory }}
          path: ${{ inputs.path-to-charm-directory }}/allure-default-results/
          if-no-files-found: error
    outputs:
      jobs: ${{ steps.collect-jobs.outputs.jobs }}
    permissions:
      contents: read

  integration-test:
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.collect-integration-tests.outputs.jobs) }}
    name: ${{ matrix.job.name }} | ${{ inputs.path-to-charm-directory }}
    needs:
      - collect-integration-tests
    runs-on: ${{ matrix.job.runner }}
    timeout-minutes: 236  # Sum of steps `timeout-minutes` + 5
    steps:
      - name: Free up disk space
        timeout-minutes: 10
        run: |
          printf '\nDisk usage before cleanup\n'
          df --human-readable
          # Based on https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
          rm -r /opt/hostedtoolcache/
          printf '\nDisk usage after cleanup\n'
          df --human-readable
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v6
      - name: Set up environment
        timeout-minutes: 10
        run: |
          sudo apt update
          sudo apt install mysql-client --yes
          sudo snap install charmcraft --classic
          pipx install tox
          pipx install poetry
      - name: Download packed charm(s)
        timeout-minutes: 5
        if: ${{ inputs.artifact-prefix != '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-prefix }}-*
          merge-multiple: true
      - name: Download test database
        timeout-minutes: 5
        run: |
          curl -L https://github.com/datacharmer/test_db/releases/download/v1.0.7/test_db-1.0.7.tar.gz | tar zx
          echo "DATA_SOURCE_PATH=$PWD/test_db/employees.sql" >> $GITHUB_ENV
      - name: Install Juju and jhack
        timeout-minutes: 5
        run: |
          sudo snap install juju --channel "${{ inputs.juju-channel }}"
          sudo snap install jhack --channel latest/edge
          sudo snap connect jhack:dot-local-share-juju snapd
      - name: Bootstrap Juju on LXD
        if: ${{ inputs.path-to-charm-directory == 'machines' }}
        timeout-minutes: 20
        run: |
          set -x
          # Disable IPv6 system-wide: containers get a ULA fd42::/prefix address from the
          # LXD bridge but the runner has no upstream IPv6 routing, so apt-get inside the
          # bootstrap container fails with ENETUNREACH and Juju bootstrap exits with code 100.
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

          sudo snap install lxd
          sudo lxd init --auto

          # Disable IPv6 on the LXD bridge: containers get a ULA fd42::/prefix address
          # but the runner has no upstream IPv6 routing, so apt-get inside the bootstrap
          # container fails with ENETUNREACH and Juju bootstrap exits with code 100.
          sudo lxc network set lxdbr0 ipv6.address none

          sudo chmod a+wr /var/snap/lxd/common/lxd/unix.socket
          juju bootstrap localhost
      - name: Install and configure Canonical K8s
        if: ${{ inputs.path-to-charm-directory == 'kubernetes' }}
        timeout-minutes: 20
        run: |
          set -x
          # Avoid conflicts with existing Docker and containerd installations
          sudo apt-get remove -y docker-ce docker-ce-cli containerd.io || true
          # Ubuntu 24.04 runners ship podman with a CNI bridge config
          # (87-podman-bridge.conflist) that sorts lexicographically before Cilium's
          # config (05-cilium.conflist). When that file is present, containerd picks the
          # podman bridge as the active CNI before Cilium is ready, bypassing the
          # node.kubernetes.io/network-unavailable taint and scheduling pods onto the
          # 10.88.0.0/16 bridge instead of the Cilium pod CIDR. Removing the file
          # leaves the CNI directory empty until Cilium writes its own config, so pods
          # stay Pending rather than landing on the wrong network.
          sudo rm -f /etc/cni/net.d/87-podman-bridge.conflist
          sudo rm -rf /run/containerd

          # --- Capture Azure DNS upstream BEFORE bootstrap ---
          # /run/systemd/resolve/resolv.conf holds the real upstream DNS that
          # systemd-resolved is currently using (no stub, no CoreDNS yet).
          # On Azure this is 168.63.129.16 — the wire-level Azure DNS server,
          # reachable from the node's primary NIC and from pod namespaces via
          # Cilium's SNAT (pod traffic exits as the node IP).
          # We must capture it now: k8s bootstrap reconfigures systemd-resolved
          # to use the CoreDNS ClusterIP as upstream, overwriting this file.
          AZURE_DNS=$(awk '/^nameserver/{print $2; exit}' /run/systemd/resolve/resolv.conf)
          echo "=== Pre-bootstrap DNS state ==="
          echo "Captured upstream DNS: ${AZURE_DNS}"
          ls -la /etc/resolv.conf
          cat /etc/resolv.conf
          cat /run/systemd/resolve/resolv.conf || echo "(file not present)"
          systemctl is-active systemd-resolved || true
          echo "=== End pre-bootstrap DNS state ==="

          # Set rp_filter=2 (loose) on ALL existing and future interfaces BEFORE
          # Cilium starts.  Ubuntu 24.04 defaults net.ipv4.conf.default.rp_filter=1
          # (strict); lxc* veths inherit that value at creation time.  With strict
          # rp_filter the kernel silently drops pod-egress packets: the reverse-path
          # lookup for src=10.244.0.x returns cilium_host, not the lxcXXX veth the
          # packet arrived on, so the packet is dropped before reaching POSTROUTING
          # and never SNATted out eth0.  Loose mode (2) accepts packets whose
          # reverse path exists on any interface, which is what Cilium requires.
          # The sysctl.d file persists through the bootstrap so every Cilium
          # interface (cilium_host, cilium_net, lxc*) inherits rp_filter=2 on
          # creation.
          sudo tee /etc/sysctl.d/99-cilium-rp-filter.conf <<'EOF'
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
EOF
          sudo sysctl --system
          # Also apply immediately to any interfaces that already exist:
          for i in /proc/sys/net/ipv4/conf/*/rp_filter; do echo 2 | sudo tee "$i"; done

          sudo snap install k8s --channel 1.32-classic/stable --classic

          # The k8s snap defaults pod-cidr to 10.1.0.0/16.  GitHub-hosted Azure
          # runners sit in 10.1.0.0/20, so the pod CIDR strictly contains the
          # host subnet.  Cilium sees the node IP (10.1.0.x), default gateway
          # (10.1.0.1), and Azure DNS (168.63.129.16) as "inside the pod fabric"
          # and misroutes (drops) pod-egress packets through the VXLAN path
          # instead of out eth0.  Use a non-overlapping pod CIDR.
          #
          # When --file is supplied, ALL cluster-config features not listed are
          # disabled by default (unlike the no-file path where network/dns/gateway/
          # metrics-server default to enabled).  List every feature we need.
          #
          # Also set dns.upstream-nameservers here so CoreDNS starts with the
          # correct upstream immediately, avoiding the post-bootstrap k8s-set +
          # rollout-restart dance.
          printf '%s\n' \
            'cluster-config:' \
            '  network:' \
            '    enabled: true' \
            '  dns:' \
            '    enabled: true' \
            '    upstream-nameservers:' \
            "    - ${AZURE_DNS}" \
            '  local-storage:' \
            '    enabled: true' \
            '  gateway:' \
            '    enabled: true' \
            '  metrics-server:' \
            '    enabled: true' \
            'pod-cidr: 10.244.0.0/16' \
            'service-cidr: 10.152.183.0/24' \
            > /tmp/k8s-bootstrap.yaml
          echo "--- bootstrap config ---"
          cat /tmp/k8s-bootstrap.yaml
          # Default timeout is 90s, which is too short on arm64
          sudo k8s bootstrap --file /tmp/k8s-bootstrap.yaml --timeout 300s

          # k8s status --wait-ready can return before components are actually ready
          # (e.g. network: disabled, ingress: Failed). Poll ourselves instead.
          for i in $(seq 1 30); do
            echo "--- k8s status check ${i}/30 ---"
            sudo k8s status --wait-ready --timeout 300s | tee /tmp/k8s-status.txt || true
            sudo k8s kubectl get pods -n kube-system || true

            if grep -qi "network:.*disabled" /tmp/k8s-status.txt; then
              echo "Network not yet up, continuing to wait..."
            else
              if grep -qi "network:.*failed" /tmp/k8s-status.txt; then
                echo "Network reports failure — aborting" >&2
                exit 1
              fi
              pod_count=$(sudo k8s kubectl get pods -n kube-system --no-headers 2>/dev/null | wc -l)
              if [ "$pod_count" -eq 0 ]; then
                echo "Network is up but no pods yet, continuing to wait..."
              else
                echo "Network is up, waiting for kube-system workloads to roll out..."
                # Use rollout status per workload instead of `kubectl wait pod --all`:
                # the latter includes terminating pods from old ReplicaSets (created during
                # k8sd's own bootstrap rollout) which never become Ready and cause a timeout.
                sudo k8s kubectl -n kube-system rollout status deployment/cilium-operator --timeout=5m
                sudo k8s kubectl -n kube-system rollout status deployment/coredns --timeout=5m
                sudo k8s kubectl -n kube-system rollout status deployment/metrics-server --timeout=5m
                sudo k8s kubectl -n kube-system rollout status daemonset/cilium --timeout=5m
                sudo k8s kubectl -n kube-system rollout status daemonset/ck-storage-rawfile-csi-node --timeout=5m
                sudo k8s kubectl -n kube-system rollout status statefulset/ck-storage-rawfile-csi-controller --timeout=5m
                break
              fi
            fi

            [ "$i" -eq 30 ] && { echo "Timed out waiting for k8s network after 10 minutes" >&2; exit 1; }
            echo "Not ready yet, waiting 20s..."
            sleep 20
          done

          # Ensure the host-level resolver still points at AZURE_DNS.
          # DO NOT replace /etc/resolv.conf or remove the symlink — doing so puts
          # systemd-resolved into "foreign" mode and disables its 127.0.0.53 stub.
          sudo resolvectl dns eth0 "${AZURE_DNS}"

          # --- Post-bootstrap verification ---
          echo "=== Post-bootstrap state ==="
          echo "--- rp_filter values (cilium_host, cilium_net, lxc* should all be 2) ---"
          for i in /proc/sys/net/ipv4/conf/*/rp_filter; do
            printf '%s = %s\n' "$i" "$(cat "$i")"
          done
          echo "--- iptables CILIUM_POST_nat MASQUERADE rule ---"
          sudo iptables -t nat -L CILIUM_POST_nat -n --line-numbers || true
          echo "--- k8sd DNS config (upstream-nameservers should be ${AZURE_DNS}) ---"
          sudo k8s get dns
          echo "--- /run/systemd/resolve/resolv.conf ---"
          cat /run/systemd/resolve/resolv.conf || echo "(file not present)"
          echo "--- Corefile in use ---"
          sudo k8s kubectl -n kube-system get configmap ck-dns-coredns \
            -o jsonpath='{.data.Corefile}'
          echo ""
          echo "=== End post-bootstrap state ==="

          # --- DNS smoke test ---
          echo "=== DNS smoke test ==="

          # --- systemd-resolved state ---
          echo "--- resolvectl status ---"
          resolvectl status || true

          # --- Host DNS ---
          echo "--- Host DNS ---"
          nslookup api.charmhub.io || echo "WARNING: host DNS smoke test failed"

          # --- Pod DNS (ClusterFirst → CoreDNS → AZURE_DNS → eth0) ---
          # Capture all interfaces so we can see: lxc veth (pod egress),
          # lo (Cilium TPROXY redirect to 127.0.0.53), eth0 (systemd-resolved
          # forwarding to AZURE_DNS).
          mkdir -p /tmp/dns-diag
          sudo tcpdump -i any -n -w /tmp/dns-diag/dns-smoke.pcap 'port 53' &
          TCPDUMP_PID=$!
          sleep 1

          echo "--- Pod DNS (ClusterFirst → CoreDNS → ${AZURE_DNS}) ---"
          sudo k8s kubectl run dns-smoke-test \
            --rm --restart=Never -i \
            --image=busybox:1.28 \
            --timeout=60s \
            -- nslookup api.charmhub.io 2>&1 || \
            echo "WARNING: pod DNS smoke test failed (non-fatal)"

          # Stop tcpdump and write a human-readable text version
          sudo kill "${TCPDUMP_PID}" 2>/dev/null || true
          wait "${TCPDUMP_PID}" 2>/dev/null || true
          sudo tcpdump -r /tmp/dns-diag/dns-smoke.pcap -v -n \
            > /tmp/dns-diag/dns-smoke.txt 2>&1 || true
          echo "--- tcpdump packet count ---"
          wc -l /tmp/dns-diag/dns-smoke.txt || true
          echo "--- tcpdump output (first 100 lines) ---"
          head -100 /tmp/dns-diag/dns-smoke.txt || true

          echo "=== End DNS smoke test ==="

          mkdir -p ~/.kube
          sudo k8s config > ~/.kube/config
      - name: Bootstrap Juju on Canonical K8s
        if: ${{ inputs.path-to-charm-directory == 'kubernetes' }}
        timeout-minutes: 20
        run: |
          set -x
          juju bootstrap k8s ck8s --bootstrap-constraints "root-disk=5G"
      - name: Configure Juju model
        timeout-minutes: 5
        run: |
          juju add-model testing
          juju model-config logging-config="<root>=INFO; unit=DEBUG"
          juju set-model-constraints arch="$(dpkg --print-architecture)"
      - name: Run integration test
        timeout-minutes: 180
        id: integration-test
        working-directory: ${{ inputs.path-to-charm-directory }}
        run: |
          tox run -e integration -- \
            "tests/integration/integration/${{ matrix.job.test_module }}" \
            --alluredir=allure-results
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          GCP_ACCESS_KEY: ${{ secrets.GCP_ACCESS_KEY }}
          GCP_SECRET_KEY: ${{ secrets.GCP_SECRET_KEY }}
          DATA_SOURCE_PATH: ${{ env.DATA_SOURCE_PATH }}
          UBUNTU_PRO_TOKEN: ${{ secrets.UBUNTU_PRO_TOKEN }}
          LANDSCAPE_ACCOUNT_NAME: ${{ secrets.LANDSCAPE_ACCOUNT_NAME }}
          LANDSCAPE_REGISTRATION_KEY: ${{ secrets.LANDSCAPE_REGISTRATION_KEY }}
      - name: Upload Allure results
        timeout-minutes: 3
        # Only upload results from amd64 runners
        # Allure can only process one result per pytest test ID,
        # and uploading from both architectures would produce overlapping IDs
        if: ${{ (success() || (failure() && steps.integration-test.outcome == 'failure')) && matrix.job.runner == 'ubuntu-24.04' && github.event_name == 'workflow_dispatch' && github.run_attempt == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-integration-test-${{ inputs.path-to-charm-directory }}-${{ matrix.job.name_in_artifact }}
          path: ${{ inputs.path-to-charm-directory }}/allure-results/
          if-no-files-found: error
      - name: snap list
        timeout-minutes: 1
        if: ${{ success() || (failure() && steps.integration-test.outcome == 'failure') }}
        run: snap list
      - name: lxc image list
        timeout-minutes: 1
        if: ${{ (success() || (failure() && steps.integration-test.outcome == 'failure')) && inputs.path-to-charm-directory == 'machines' }}
        run: sudo lxc image list
      - name: Select model
        timeout-minutes: 1
        if: ${{ success() || (failure() && steps.integration-test.outcome == 'failure') }}
        id: juju-switch
        run: |
          juju switch testing
          mkdir ~/logs/
      - name: juju status
        timeout-minutes: 1
        if: ${{ success() || (failure() && steps.integration-test.outcome == 'failure') }}
        run: juju status --color --relations | tee ~/logs/juju-status.txt
      - name: juju debug-log
        timeout-minutes: 3
        if: ${{ success() || (failure() && steps.integration-test.outcome == 'failure') }}
        run: juju debug-log --ms --color --replay --no-tail | tee ~/logs/juju-debug-log.txt
      - name: juju debug-log controller
        timeout-minutes: 3
        if: ${{ success() || (failure() && steps.integration-test.outcome == 'failure') }}
        run: juju debug-log --ms -m controller --color --replay --no-tail | tee ~/logs/juju-debug-log-controller.txt
      - name: jhack tail
        timeout-minutes: 3
        if: ${{ success() || (failure() && steps.integration-test.outcome == 'failure') }}
        run: jhack tail --printer raw --replay --no-watch | tee ~/logs/jhack-tail.txt
      - name: Upload logs
        timeout-minutes: 5
        if: ${{ success() || (failure() && steps.integration-test.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-integration-test-${{ inputs.path-to-charm-directory }}-${{ matrix.job.name_in_artifact }}
          path: ~/logs/
          if-no-files-found: error
      - name: Disk usage
        timeout-minutes: 1
        if: ${{ success() || (failure() && steps.integration-test.outcome == 'failure') }}
        run: df --human-readable
      - name: k8s inspect
        if: ${{ always() && inputs.path-to-charm-directory == 'kubernetes' }}
        timeout-minutes: 5
        run: sudo k8s inspect
      - name: Upload k8s inspect report
        if: ${{ always() && inputs.path-to-charm-directory == 'kubernetes' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: k8s-inspect-${{ matrix.job.name_in_artifact }}
          path: inspection-report-*.tar.gz
          if-no-files-found: error
      - name: Upload DNS tcpdump
        if: ${{ always() && inputs.path-to-charm-directory == 'kubernetes' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: dns-tcpdump-${{ matrix.job.name_in_artifact }}
          path: /tmp/dns-diag/
          if-no-files-found: ignore
