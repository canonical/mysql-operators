name: Integration tests

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: |
          Prefix for charm package GitHub artifact(s)

          Use canonical/data-platform-workflows build_charm.yaml to build the charm(s)
        required: true
        type: string
      path-to-charm-directory:
        description: Relative path to charm directory from repository directory
        default: .
        type: string

jobs:
  collect-integration-tests:
    name: Collect spread jobs | ${{ inputs.path-to-charm-directory }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up environment
        run: |
          sudo snap install go --classic
          go install github.com/canonical/spread/cmd/spread@latest
          pipx install tox
          pipx install poetry
      - name: Collect spread jobs
        id: collect-jobs
        working-directory: ${{ inputs.path-to-charm-directory }}
        shell: python
        run: |
          import json
          import os
          import pathlib
          import subprocess

          spread_jobs = (
              subprocess.run(
                  [pathlib.Path.home() / "go/bin/spread", "-list", "github-ci:tests/spread/integration/"],
                  capture_output=True,
                  check=True,
                  text=True,
              )
              .stdout.strip()
              .split("\n")
          )
          jobs = []
          for job in spread_jobs:
              # Example `job`: "github-ci:ubuntu-24.04:tests/spread/integration/test_charm.py:juju36"
              _, runner, task, variant = job.split(":")
              # Example: "test_charm.py"
              task = task.removeprefix("tests/spread/integration/")
              if runner.endswith("-arm"):
                  architecture = "arm64"
              else:
                  architecture = "amd64"
              # Example: "test_charm.py:juju36 | amd64"
              name = f"{task}:{variant} | {architecture}"
              # ":" character not valid in GitHub Actions artifact
              name_in_artifact = f"{task}-{variant}-{architecture}"
              jobs.append({
                  "spread_job": job,
                  "name": name,
                  "name_in_artifact": name_in_artifact,
                  "runner": runner,
              })
          output = f"jobs={json.dumps(jobs)}"
          print(output)
          with open(os.environ["GITHUB_OUTPUT"], "a") as file:
              file.write(output)
      - name: Generate Allure default test results
        if: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt == '1' }}
        working-directory: ${{ inputs.path-to-charm-directory }}
        run: tox run -e integration -- tests/integration/integration --allure-default-dir=allure-default-results
      - name: Upload Allure default results
        # Default test results in case the integration tests time out or runner set up fails
        # (So that Allure report will show "unknown"/"failed" test result, instead of omitting the test)
        if: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-default-results-integration-test-${{ inputs.path-to-charm-directory }}
          path: ${{ inputs.path-to-charm-directory }}/allure-default-results/
          if-no-files-found: error
    outputs:
      jobs: ${{ steps.collect-jobs.outputs.jobs }}

  integration-test:
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.collect-integration-tests.outputs.jobs) }}
    name: ${{ matrix.job.name }} | ${{ inputs.path-to-charm-directory }}
    needs:
      - collect-integration-tests
    runs-on: ${{ matrix.job.runner }}
    timeout-minutes: 236  # Sum of steps `timeout-minutes` + 5
    steps:
      - name: Free up disk space
        timeout-minutes: 10
        run: |
          printf '\nDisk usage before cleanup\n'
          df --human-readable
          # Based on https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
          rm -r /opt/hostedtoolcache/
          printf '\nDisk usage after cleanup\n'
          df --human-readable
      - name: Purge Docker
        # GitHub-hosted Azure runners ship Docker pre-installed and active.
        # Canonical K8s requires "A system with no previous installations
        # of containerd/docker as this may cause conflicts"
        # (see https://documentation.ubuntu.com/canonical-kubernetes
        # /release-1.32/snap/tutorial/getting-started/).
        # Completely purging Docker requires also
        # deleting the Docker-specific `iptables-nft` rulesets
        # created on installation.
        if: ${{ inputs.path-to-charm-directory == 'kubernetes' }}
        timeout-minutes: 5
        run: |
          sudo apt-get remove --purge -y docker-ce docker-ce-cli containerd.io docker.io containerd 2>/dev/null || true
          sudo nft flush ruleset
          sudo ip link delete docker0 2>/dev/null || true
      - name: Remove podman CNI bridge config
        # Ubuntu 24.04 runners ship podman with a CNI bridge config
        # (/etc/cni/net.d/87-podman-bridge.conflist) that sorts
        # lexicographically before Cilium's config (05-cilium.conflist).
        # When that file is present, containerd picks the podman bridge
        # as the active CNI before Cilium is ready, bypassing the
        # node.kubernetes.io/network-unavailable taint and scheduling
        # pods onto the 10.88.0.0/16 bridge instead of the Cilium pod
        # CIDR. Removing the file ensures Cilium is the only CNI plugin
        # from the start.
        if: ${{ inputs.path-to-charm-directory == 'kubernetes' }}
        timeout-minutes: 1
        run: |
          sudo rm -f /etc/cni/net.d/87-podman-bridge.conflist
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v6
      - name: Set up environment
        timeout-minutes: 10
        run: |
          sudo apt update
          sudo apt install mysql-client --yes
          sudo snap install charmcraft --classic
          sudo snap install go --classic
          go install github.com/canonical/spread/cmd/spread@latest
      - name: Download packed charm(s)
        timeout-minutes: 5
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-prefix }}-*
          merge-multiple: true
      - name: Download test database
        timeout-minutes: 5
        run: |
          curl -L https://github.com/datacharmer/test_db/releases/download/v1.0.7/test_db-1.0.7.tar.gz | tar zx
          echo "DATA_SOURCE_PATH=$PWD/test_db/employees.sql" >> $GITHUB_ENV
      - name: Run spread job
        timeout-minutes: 180
        id: spread
        working-directory: ${{ inputs.path-to-charm-directory }}
        run: ~/go/bin/spread -vv -artifacts=artifacts '${{ matrix.job.spread_job }}'
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          GCP_ACCESS_KEY: ${{ secrets.GCP_ACCESS_KEY }}
          GCP_SECRET_KEY: ${{ secrets.GCP_SECRET_KEY }}
          DATA_SOURCE_PATH: ${{ env.DATA_SOURCE_PATH }}
          UBUNTU_PRO_TOKEN: ${{ secrets.UBUNTU_PRO_TOKEN }}
          LANDSCAPE_ACCOUNT_NAME: ${{ secrets.LANDSCAPE_ACCOUNT_NAME }}
          LANDSCAPE_REGISTRATION_KEY: ${{ secrets.LANDSCAPE_REGISTRATION_KEY }}
      - name: Upload Allure results
        timeout-minutes: 3
        # Only upload results from one spread system & one spread variant
        # Allure can only process one result per pytest test ID. If parameterization is done via
        # spread instead of pytest, there will be overlapping pytest test IDs.
        if: ${{ (success() || (failure() && steps.spread.outcome == 'failure')) && startsWith(matrix.job.spread_job, 'github-ci:ubuntu-24.04:') && github.event_name == 'workflow_dispatch' && github.run_attempt == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-integration-test-${{ inputs.path-to-charm-directory }}-${{ matrix.job.name_in_artifact }}
          path: ${{ inputs.path-to-charm-directory }}/artifacts/${{ matrix.job.spread_job }}/allure-results/
          if-no-files-found: error
      - timeout-minutes: 1
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        run: snap list
      - name: lxc image list
        timeout-minutes: 1
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        # sudo needed since spread runs scripts as root
        run: sudo lxc image list
      - name: Select model
        timeout-minutes: 1
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        id: juju-switch
        run: |
          # sudo needed since spread runs scripts as root
          # "testing" is default model created by concierge
          sudo juju switch testing
          mkdir ~/logs/
      - name: juju status
        timeout-minutes: 1
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        run: sudo juju status --color --relations | tee ~/logs/juju-status.txt
      - name: juju debug-log
        timeout-minutes: 3
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        run: sudo juju debug-log --ms --color --replay --no-tail | tee ~/logs/juju-debug-log.txt
      - name: juju debug-log controller
        timeout-minutes: 3
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        run: sudo juju debug-log --ms -m controller --color --replay --no-tail | tee ~/logs/juju-debug-log-controller.txt
      - name: jhack tail
        timeout-minutes: 3
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        run: sudo jhack tail --printer raw --replay --no-watch | tee ~/logs/jhack-tail.txt
      - name: Upload logs
        timeout-minutes: 5
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-integration-test-${{ inputs.path-to-charm-directory }}-${{ matrix.job.name_in_artifact }}
          path: ~/logs/
          if-no-files-found: error
      - name: Disk usage
        timeout-minutes: 1
        if: ${{ success() || (failure() && steps.spread.outcome == 'failure') }}
        run: df --human-readable
