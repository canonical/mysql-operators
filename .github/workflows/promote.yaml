name: Promote charms

on:
  workflow_dispatch:
    inputs:
      revisions:
        description: |
          Comma-separated list of git revision tags to promote.
          These must match the tags created by canonical/data-platform-workflows release_charm_edge.yaml

          Example: 'mysql/rev123,mysql/rev124,mysql-k8s/rev125,mysql-k8s/rev126'
        required: true
        type: string
      to-risk:
        description: Promote to this Charmhub risk
        required: true
        type: choice
        options:
          - beta
          - candidate
          - stable

jobs:
  promote:
    name: Promote charms
    uses: canonical/data-platform-workflows/.github/workflows/_promote_charms.yaml@v53
    with:
      track: '8.4'
      revisions: ${{ inputs.revisions }}
      to-risk: ${{ inputs.to-risk }}
    secrets:
      charmhub-token: ${{ secrets.CHARMHUB_TOKEN }}
    permissions:
      contents: write  # Needed to edit GitHub releases
    cache-mode: none
